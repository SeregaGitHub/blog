<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post</title>

    <link rel="stylesheet" type="text/css" th:href="@{/static/style/post.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/style/css.css}">

</head>

<body>

<div th:object="${post}" style="height: 100%; font-size: large;">

    <div style="display: flex; align-items: center; justify-content: center; font-size: large; font-weight: bold;">
        <p th:text="*{name}"></p>
    </div>

    <div style="display: flex; align-items: center; justify-content: center;">
        <img th:src="*{imageUrl}" alt="Image not found" width="250px" height="250px">
    </div>

    <div style="display: flex; justify-content: center; margin-top: 10px;">
<!--    <div th:object="${updatePostDto}" style="display: flex; justify-content: center; margin-top: 10px;">-->
<!--        <form th:action="@{/feed/{post_id}(post_id=*{id})}" method="post">
            <input type="hidden" name="_method" value="delete">
            <button style="margin: 10px;" type="submit">UPDATE</button>
        </form>-->
        <button style="margin: 10px;" onclick="togglePostUpdateForm()">UPDATE</button>

        <form th:action="@{/feed/delete/{post_id}(post_id=*{id})}" method="post">
            <input type="hidden" name="_method" value="delete">
            <button style="margin: 10px;" type="submit">DELETE</button>
        </form>
    </div>

    <div th:object="${updatePostDto}" class="form-container" style="display: none;" id="postUpdateForm">
        <h2>Update Post</h2>
        <form th:action="@{/feed/update/{post_id}(post_id=*{id})}" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" name="name" required>

            <label for="imageUrl">Image:</label>
            <input type="url" id="imageUrl" th:field="*{imageUrl}" name="imageUrl" required>

            <label for="description">Description:</label>
            <textarea
                    id="description"
                    name="description"
                    cols="30"
                    rows="10"
                    th:field="*{description}"
                    required
            ></textarea>

            <label for="tags">Tags:</label>
            <input type="text" id="tags" name="tags" th:field="*{tags}" required>
            <button style="margin: 10px;" type="submit">DO UPDATE</button>
        </form>
    </div>

    <div style="display: flex; align-items: center; justify-content: center;">
        <p style="font-size: 900;">Tags: </p>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
        <div class="post-border">
            <tr th:each="t : *{tags}">
                <td th:text="${t}"></td>
            </tr>
        </div>
    </div>

    <div style="display: flex; justify-content: center; margin-top: 10px;">
        <form th:action="@{/feed/likes/post/{post_id}(post_id=*{id})}" method="POST" style="width: 200px;">
            <button type="submit" style="margin: 10px;">ADD LIKE</button>
            <div style="display: flex;">
                <p style="flex: 1">Likes count: </p>
                <p style="flex: 1" th:text="*{likes}"></p>
            </div>
        </form>
    </div>

    <div style="display: flex; align-items: center; justify-content: center;">
        <p style="font-size: 900;">Description: </p>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
        <div class="post-border">
            <tr th:each="d : *{description}">
                <td><p th:text="${d}"></p></td>
            </tr>
        </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center;">
        <div style="height: 100%">
            <div style="display: flex; align-items: center; justify-content: center;">
                <button style="margin: 10px;"  onclick="toggleCommentForm()">ADD COMMENT</button>
                <p style="font-size: 900;">Comments: </p>
            </div>

            <div style="display: none;" id="commentForm">
                <form th:action="@{/feed/comment/post/{post_id}(post_id=*{id})}" method="POST">

                    <label for="commentText">Comment text:</label>
                    <textarea
                            id="commentText"
                            name="commentText"
                            cols="70"
                            rows="10"
                            required
                    ></textarea>

                    <button type="submit">Create comment</button>
                </form>
            </div>
        </div>


    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
        <div class="post-border">
            <tr th:each="c : *{comments}">
                <td><p th:text="${c.postComment}" style="background-color: #DCDCDC;"></p>
                    <form th:action="@{/feed/comment/delete/{comment_id}/post/{post_id}(comment_id=${c.id}, post_id=*{id})}" method="post" style="display:inline;">
                        <input type="hidden" name="_method" value="delete">
                        <button style="margin: 10px;" type="submit">DELETE</button>
                    </form>
                </td>
                <hr/>
            </tr>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/static/script/js.js}"></script>

</body>
</html>
