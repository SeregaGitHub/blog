<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts Feed</title>

    <link rel="stylesheet" type="text/css" th:href="@{/static/style/css.css}">

</head>
<body>
<h1>POSTS</h1>
<button class="btn-add" onclick="toggleForm()">Добавить пост</button>

<table>
    <thead>
    <tr>
        <th>Имя</th>
        <th>Картинка</th>
        <th>Описание</th>
        <th>Количество лайков</th>
        <th>Количество комментариев</th>
        <th>Тэги</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="postsFeed : ${feed}">
        <td th:text="${postsFeed.name}"></td>
        <td th:text="${postsFeed.imageUrl}"></td>
        <td th:text="${postsFeed.abbreviatedDescription}"></td>
        <td th:text="${postsFeed.likesCount}"></td>
        <td th:text="${postsFeed.commentsCount}"></td>
        <td>
            <p th:each="tag: ${postsFeed.tags}"> <span th:text="${tag}"/>
        </td>
    </tr>
    </tbody>

</table>
