<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts Feed</title>

    <link rel="stylesheet" type="text/css" th:href="@{/static/style/css.css}">

</head>
<body>
<h1>POSTS</h1>
<button class="btn-add" onclick="toggleForm()">Add Post</button>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Image</th>
        <th>Description</th>
        <th>Likes Count</th>
        <th>Comments Count</th>
        <th>Tags</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="postsFeed : ${feed}">
        <td th:text="${postsFeed.name}"></td>
        <td th:text="${postsFeed.imageUrl}"></td>
        <td th:text="${postsFeed.abbreviatedDescription}"></td>
        <td th:text="${postsFeed.likesCount}"></td>
        <td th:text="${postsFeed.commentsCount}"></td>
        <td th:text="${postsFeed.tags}"></td>
        <!--<td>
            <p th:each="tag: ${postsFeed.tags}"> <span th:text="${tag}"/>
        </td>-->
    </tr>
    </tbody>

</table>

<div class="form-container" style="display: none;" id="postForm">
    <h2>Create Post</h2>
    <form th:action="@{/feed}" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="imageUrl">Image:</label>
        <input type="url" id="imageUrl" name="imageUrl" required>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required>
<!--        <textarea-->
<!--                id="description"-->
<!--                name="description"-->
<!--                cols="30"-->
<!--                rows="10"-->
<!--                required-->
<!--                ></textarea>-->

        <label for="tags">Tags:</label>
        <input type="text" id="tags" name="tags" required>

        <button type="submit">Create</button>
    </form>
</div>
