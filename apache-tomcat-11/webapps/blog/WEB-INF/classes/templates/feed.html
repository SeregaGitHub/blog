<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts Feed</title>

    <link rel="stylesheet" type="text/css" th:href="@{/static/style/css.css}">

</head>
<body>
<h1>POSTS</h1>
<button class="btn-add" onclick="toggleForm()">Add Post</button>

<h2>Filtering by tag...</h2>

<article class="content">
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Likes Count</th>
            <th>Comments Count</th>
            <th>Tags</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="postsFeed : ${feed.postsFeedList}">
            <td th:text="${postsFeed.name}"></td>
            <td><img th:src="${postsFeed.imageUrl}" alt="Image not found" width="50px" height="50px"/></td>
            <td th:text="${postsFeed.abbreviatedDescription}"></td>
            <td th:text="${postsFeed.likesCount}"></td>
            <td th:text="${postsFeed.commentsCount}"></td>
            <td th:text="${postsFeed.tags}"></td>
            <!--<td>
                <p th:each="tag: ${postsFeed.tags}"> <span th:text="${tag}"/>
            </td>-->
        </tr>
        </tbody>

    </table>


    <div style="flex-direction: row; margin-bottom: 45px">
        <a th:href="@{/feed(page=${feed.page}, size=${feed.size}, prev=prev, posts=${feed.postsCount})}"
        ><button type="button">Prev</button></a>

        <a th:href="@{/feed(page=${feed.page}, size=${feed.size}, next=next, posts=${feed.postsCount})}"
        ><button type="button">Next</button></a>
    </div>

    <p style="margin-bottom: 2px">Posts count:</p>

    <div style="flex-direction: row;">
        <form th:action="@{/feed}" style="flex-direction: row;">
            <button type="submit" th:name="size" th:value="10">10</button>
            <button type="submit" th:name="size" th:value="20">20</button>
            <button type="submit" th:name="size" th:value="50">50</button>
        </form>
    </div>

</article>


<div class="form-container" style="display: none;" id="postForm">
    <h2>Create Post</h2>
    <form th:action="@{/feed}" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="imageUrl">Image:</label>
        <input type="url" id="imageUrl" name="imageUrl" required>

        <label for="description">Description:</label>
        <textarea
                id="description"
                name="description"
                cols="30"
                rows="10"
                required
        ></textarea>

        <label for="tags">Tags:</label>
        <input type="text" id="tags" name="tags" required>

        <button type="submit">Create</button>
    </form>
</div>
